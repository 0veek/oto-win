[package]
name = "oto"
version = "0.2.0"
description = "System-wide AI voice dictation for Windows"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang.org/cargo/issues/8519
name = "oto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
directories = "6.0.0"
dirs = "6.0.0"
keyring = "4.1.5"
cpal = "0.18.1"
hound = "3.5.1"
tauri-plugin-global-shortcut = "2.3.2"
async-trait = "0.1.91"
arboard = "3.6.1"
whisper-rs = "0.16.0"
# Streaming STT. rustls only — no native-tls, so no OpenSSL on the build host.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3.33"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  # Reading the focused control's selection for the `Selection` context tier.
  "Win32_UI_Accessibility",
  "Win32_System_Com",
] }
# Pin to match `windows` 0.61 / Tauri. Without this, cpal's loose range can pull
# windows-core 0.62 and break the WASAPI host with Interface trait mismatches.
windows-core = "=0.61.2"

[dev-dependencies]
tempfile = "3.27.0"

# Production builds serve the embedded frontend (frontendDist).
# `tauri dev` disables this so the app loads the Vite dev server instead.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
